name: crisismmd-v3-nvidia
services:
  vllm:
    image: vllm/vllm-openai:v0.19.0
    ipc: host
    ports:
      - "${V3_VLLM_PORT:-8000}:8000"
    volumes:
      - ../.cache/huggingface:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - --model
      - ${V3_MODEL_ID:-Qwen/Qwen3.5-9B}
      - --served-model-name
      - ${V3_SERVED_NAME:-v3-model}
      - --max-model-len
      - "4096"
      - --limit-mm-per-prompt
      - '{"image":1}'
      - --generation-config
      - vllm
      - --trust-remote-code

  research:
    build:
      context: ..
      dockerfile: docker/Dockerfile.pipeline
    working_dir: /workspace
    volumes:
      - ..:/workspace
    environment:
      VLM_BASE_URL: http://vllm:8000/v1
      V3_PYTHON: python
    depends_on:
      - vllm
    stdin_open: true
    tty: true
