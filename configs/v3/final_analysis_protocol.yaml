schema_version: 1
protocol_name: v3_paper_facing_conditional_robustness
status: frozen_before_canonical_bf16_attacks
paper_scope_amendment: d018_d021_2026_08_26
seed: 42

framing:
  study: controlled_adversarial_robustness_audit_of_off_the_shelf_vlms
  primary_question: >-
    When an off-the-shelf VLM correctly assesses disaster damage, how
    vulnerable is that decision to malicious information delivered through
    the image, the accompanying text, or both?
  deployment_readiness_is_not_attack_eligibility: true
  paper_uses_clean_pass_fail_thresholds: false
  clean_performance_reporting: continuous_descriptive_metrics
  no_model_pooling: true

artifacts:
  condition_manifest: data/v3/manifests/all_conditions.csv
  source_table: data/processed/all_valid_damage_samples.csv
  prompt: configs/prompts/frozen_prompt_v4.yaml
  main_split: data/v3/splits/main.csv
  pilot_split: data/v3/splits/pilot.csv
  style_split: data/v3/splits/style_ablation.csv
  size_split: data/v3/splits/size_ablation.csv
  expected_main_samples: 720
  expected_conditions_per_main_sample: 10

deployment_readiness_gate:
  role: historical_audit_only_superseded_by_d018
  active_in_manuscript: false
  accuracy_min: 0.70
  macro_f1_min: 0.65
  every_class_recall_min: 0.50
  parse_rate_min: 0.995

inference:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 150
  thinking: false
  concurrency: 1
  server_backend: mlx_vlm
  server_port: 8091
  startup_timeout_seconds: 3600
  shutdown_timeout_seconds: 90
  continue_on_model_failure: true
  offline_only: true

analysis:
  labels: [little_or_no_damage, mild_damage, severe_damage]
  severity_levels:
    little_or_no_damage: 0
    mild_damage: 1
    severe_damage: 2
  target_eligible_ground_truth: [mild_damage, severe_damage]
  bootstrap_draws: 5000
  bootstrap_seed: 42
  confidence_level: 0.95
  strict_visual_match_fields:
    - text_bbox
    - placement_region
    - font_size_px
    - line_count
    - opacity
    - occupied_area_ratio
  comparison_families:
    direct_modality:
      - [direct_image, direct_text]
      - [direct_image, direct_joint]
      - [direct_text, direct_joint]
    misleading_modality:
      - [misleading_image, misleading_text]
      - [misleading_image, misleading_joint]
      - [misleading_text, misleading_joint]
    semantics_within_modality:
      - [direct_image, misleading_image]
      - [direct_text, misleading_text]
      - [direct_joint, misleading_joint]

quantization_sensitivity:
  - bf16_model_slug: qwen35_27b_bf16
    historical_precision: 8bit
    historical_model_id: mlx-community/Qwen3.5-27B-8bit
    historical_metrics: results/v3/v3_qwen35_27b_8bit_main_seed42/metrics.json
  - bf16_model_slug: qwen3vl_32b_bf16
    historical_precision: 8bit
    historical_model_id: mlx-community/Qwen3-VL-32B-Instruct-8bit
    historical_metrics: results/v3/v3_qwen3vl_32b_8bit_main_seed42/metrics.json

