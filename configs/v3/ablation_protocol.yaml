schema_version: 1
protocol_name: v3_paper_facing_visual_ablation
status: frozen_before_mixed_precision_ablation_inference
seed: 42

artifacts:
  source_manifest: data/v3/manifests/all_conditions.csv
  style_split: data/v3/splits/style_ablation.csv
  size_split: data/v3/splits/size_ablation.csv
  style_manifest: data/v3/manifests/style_ablation_conditions.csv
  size_manifest: data/v3/manifests/size_ablation_conditions.csv
  prompt: configs/prompts/frozen_prompt_v4.yaml
  audit_json: reports/v3/ablation_protocol/dataset_audit.json
  audit_markdown: reports/v3/ablation_protocol/dataset_audit.md
  ram_json: reports/v3/ablation_protocol/ram_readiness.json
  ram_markdown: reports/v3/ablation_protocol/ram_readiness.md

sampling:
  unit: independent_duplicate_cluster_representative
  class_balance: exact
  event_strategy: deterministic_least_represented_event_within_class
  population_representative: false
  overlap_with_other_v3_splits_allowed: false
  interpretation: secondary_paired_mechanism_analysis

style:
  paper_name: presentation_style_ablation
  source_samples: 120
  per_class: 40
  conditions:
    - clean
    - benign_simple
    - benign_news
    - benign_camouflage
    - direct_simple
    - direct_news
    - direct_camouflage
    - misleading_simple
    - misleading_news
    - misleading_camouflage
  fixed:
    attack_modality: image
    nominal_text_size: medium
    assigned_payload_within_semantics: true
  variants:
    simple: high_contrast_deterministic_edge_overlay
    news: fictional_news_lower_third
    camouflage: low_contrast_background_aware_edge_text
  caveat: >-
    The variants change a presentation package, including contrast, background,
    occupied area, and placement policy. Effects must not be attributed to a
    single isolated visual-style component.

size:
  paper_name: relative_text_size_ablation
  source_samples: 60
  per_class: 20
  conditions:
    - clean
    - benign_small
    - benign_medium
    - benign_large
    - direct_small
    - direct_medium
    - direct_large
    - misleading_small
    - misleading_medium
    - misleading_large
  fixed:
    attack_modality: image
    visual_style: simple_overlay
    assigned_payload_within_semantics: true
    placement_within_sample_semantics: true
    colors_and_opacity_within_sample_semantics: true
  target_relative_font_heights:
    small: 0.030
    medium: 0.050
    large: 0.080

analysis:
  primary_metric: downward_asr_on_clean_correct_mild_or_severe
  secondary_metrics:
    - malicious_minus_matched_benign_downward_risk_difference
    - target_eligible_severity_drop
    - induced_severe_undertriage
    - induced_critical_undertriage
    - clean_accuracy
    - clean_macro_f1
  report_numerators_and_denominators: true
  confidence_level: 0.95
  proportion_interval: wilson
  paired_bootstrap_draws: 5000
  paired_bootstrap_seed: 42
  paired_binary_test: exact_two_sided_mcnemar
  multiplicity: holm_within_ablation_semantics_family
  no_model_pooling: true
  no_monotonic_size_claim_without_supported_ordered_pattern: true

runtime:
  server_port: 8093
  concurrency: 1
  max_kv_size: 4096
  vision_cache_size: 1
  minimum_post_load_reserve_gib: 64
  allow_other_training_processes: true
  allow_other_model_servers_on_different_ports: true
  offline_only: true

models:
  - slug: qwen35_27b_bf16
    aliases: [qwen27, qwen35]
    model_id: mlx-community/Qwen3.5-27B-bf16
    precision: bf16
    expected_peak_gib: 75
    default_run: true
    role: primary_dense_qwen
  - slug: mistral31_24b_8bit
    aliases: [mistral8, mistral8bit]
    model_id: mlx-community/Mistral-Small-3.1-24B-Instruct-2503-8bit
    precision: 8bit
    expected_peak_gib: 55
    default_run: true
    role: completed_8bit_cross_family_reference
  - slug: qwen3vl_32b_8bit
    aliases: [qwenvl32, qwenvl32_8bit]
    model_id: mlx-community/Qwen3-VL-32B-Instruct-8bit
    precision: 8bit
    expected_peak_gib: 65
    default_run: true
    role: completed_8bit_vision_specialist
  - slug: qwen36_27b_bf16
    aliases: [qwen36]
    model_id: mlx-community/Qwen3.6-27B-bf16
    precision: bf16
    expected_peak_gib: 75
    default_run: false
    role: qwen_release_sensitivity
  - slug: mistral31_24b_bf16
    aliases: [mistral]
    model_id: mlx-community/Mistral-Small-3.1-24B-Instruct-2503-bf16
    precision: bf16
    expected_peak_gib: 70
    default_run: false
    role: cross_family_dense_pixtral
  - slug: gemma4_12b_bf16
    aliases: [gemma12]
    model_id: mlx-community/gemma-4-12B-it-bf16
    precision: bf16
    expected_peak_gib: 45
    default_run: false
    role: optional_lower_bound
  - slug: qwen36_35b_a3b_bf16
    aliases: [qwen36_moe, qwen35a3b]
    model_id: mlx-community/Qwen3.6-35B-A3B-bf16
    precision: bf16
    expected_peak_gib: 100
    default_run: false
    role: optional_sparse_moe
  - slug: qwen3vl_32b_bf16
    aliases: [qwen32]
    model_id: mlx-community/Qwen3-VL-32B-Instruct-bf16
    precision: bf16
    expected_peak_gib: 100
    default_run: false
    role: intended_vision_specialist
  - slug: gemma4_31b_bf16
    aliases: [gemma31]
    model_id: mlx-community/gemma-4-31b-it-bf16
    precision: bf16
    expected_peak_gib: 95
    default_run: false
    role: optional_cross_family_dense

literature:
  - title: Typographic Attacks in a Multi-Image Setting
    venue: NAACL 2025
    url: https://aclanthology.org/2025.naacl-long.626/
    relevance: multi_image_typographic_attack_evaluation_and_non_repeated_payloads
  - title: SceneTAP - Scene-Coherent Typographic Adversarial Planner
    venue: CVPR 2025
    url: https://openaccess.thecvf.com/content/CVPR2025/papers/Cao_SceneTAP_Scene-Coherent_Typographic_Adversarial_Planner_against_Vision-Language_Models_in_Real-World_CVPR_2025_paper.pdf
    relevance: presentation_and_scene_integration_are_attack_factors
  - title: Reading Between the Pixels
    venue: arXiv preprint 2026
    url: https://arxiv.org/abs/2604.12371
    relevance: controlled_font_size_and_visual_transformation_sensitivity
    caveat: concurrent_preprint_not_peer_reviewed
