# Run only for a model that passes both clean gates.
quantization_sensitivity:
  preferred_slug: qwen35_27b_8bit
  scope: prompt_validation_plus_main
  variants:
    - precision: bf16
      mac_model_id: mlx-community/Qwen3.5-27B-bf16
    - precision: 8bit
      mac_model_id: mlx-community/Qwen3.5-27B-8bit
    - precision: 4bit
      mac_model_id: mlx-community/Qwen3.5-27B-4bit

required_lock_fields:
