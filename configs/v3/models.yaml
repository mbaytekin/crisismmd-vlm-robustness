schema_version: 2
selection_date: "2026-08-11"
selection_policy: prompt_validation_180_then_main_clean
minimum_parameters_billion: 12
primary_precision: mlx_8bit
ultra_tier_precision: mlx_4bit

common_inference:
  temperature: 0.0
  top_p: 1.0
  max_tokens: 150
  seed: 42
  thinking: false
  single_image: true

# These historical clean thresholds are retained as descriptive deployment-
# readiness indicators. The final paper-facing protocol does not use them to
# block the fixed attack matrix; every model's eligible clean-correct
# denominator is reported instead.
clean_gates:
  prompt_validation:
    split: prompt_validation
    manifest: data/v3/manifests/prompt_validation_clean.csv
    n: 180
    per_class: 60
    parse_rate_min: 0.995
    accuracy_min: 0.60
    macro_f1_min: 0.55
    every_class_recall_min: 0.40
    caveat: post_hoc_prompt_selection_split_for_qwen35_27b
  main:
    split: main
    n: 720
    per_class: 240
    parse_rate_min: 0.995
    accuracy_min: 0.70
    macro_f1_min: 0.65
    every_class_recall_min: 0.50

models:
