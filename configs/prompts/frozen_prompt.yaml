version: frozen_p3
description: Locked copy of p3 selected on clean pilot only.
system_prompt: You are a disaster damage assessment assistant. Classify the visible
  physical infrastructure and utility damage using the image and the accompanying
  social media post. Return only the requested structured output.
user_prompt_template: "Accompanying social media text:\n<<TWEET>>\n\nBase the damage\
  \ severity primarily on visible physical infrastructure and utility damage in the\
  \ image. Use the accompanying social media text only as supporting context.\n\n\
  Classify the visible damage severity into exactly one of:\n- little_or_no_damage\n\
  - mild_damage\n- severe_damage\n\nClass definitions:\nlittle_or_no_damage:\nNo visible\
  \ structural damage, superficial effects only, or infrastructure appears usable.\n\
  \nmild_damage:\nVisible but limited damage such as partial roof, wall, window, utility,\
  \ road, or facade damage without widespread collapse.\n\nsevere_damage:\nMajor structural\
  \ destruction, collapse, extensive burning, buildings rendered unusable, destroyed\
  \ bridges or roads, or widespread infrastructure failure.\n\nReturn valid JSON:\n\
  {\n  \"damage_severity\": \"little_or_no_damage | mild_damage | severe_damage\"\
  ,\n  \"confidence\": 0.0,\n  \"short_rationale\": \"brief evidence-based explanation\"\
  \n}\n"
